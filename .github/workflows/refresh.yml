name: refresh-proxy-list

# Lightweight re-validation: re-tests only proxies already in proxies/json/ (no
# scraping), so it runs ~5x faster than the daily update. Keeps the list fresher
# than once-a-day given free proxies live for minutes-to-hours.

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours at off-round minutes to spread API load (not :00/:30).
    - cron: "23 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Shared with update.yml: both commit auto-generated data files, so runs are
  # serialized (queued, never cancelled) instead of racing on push.
  group: proxy-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Single job: build → commit → deploy, all on the same runner + working tree.
    # A separate deploy-pages job used to re-checkout@v4, which fetches the SHA the
    # run was *triggered* on — not the fresh commit `build` just pushed — so Pages
    # always lagged one run behind. Keeping deploy inline means we upload the exact
    # docs/ we just generated and committed.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Refresh proxies (re-validate existing set only)
        env:
          PROXY_TIMEOUT_SEC: "8"
          PROXY_CONCURRENCY: "200"
        run: python scripts/update.py --refresh

      - name: Commit changes (if any)
        id: commit
        env:
          PROXY_TIMEOUT_SEC: "8"
          PROXY_CONCURRENCY: "200"
        run: |
          commit_refresh() {
            git add -A
            if git diff --cached --quiet; then
              echo "Regenerated tree matches origin/main; nothing to commit."
              return 1
            fi
            git commit -m "chore: 6h proxy refresh (re-validate existing)"
          }
          if git diff --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_refresh || { echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # This run checks out the SHA it was triggered on, and GitHub's
          # scheduler delay can fire the daily update and the 6h refresh minutes
          # apart even though the proxy-pipeline group serializes them — so
          # origin/main can move mid-run. Rebasing the generated commit onto
          # that newer data hits modify/delete conflicts -X theirs cannot
          # resolve (a country file emptied by the refresh, modified by the
          # daily), and where the rebase does succeed -X theirs silently drops
          # the newer scrape's additions. Instead of resolving, discard the
          # stale commit and regenerate on the fresh base: re-validation is a
          # pure function of base + time, so the regenerated tree is exactly
          # what this run would have produced had it started late.
          for i in 1 2 3; do
            if git push; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Push kept getting rejected; failing the run instead of force-pushing over newer data."
              exit 1
            fi
            echo "Push rejected (attempt $i); origin/main moved — regenerating on the fresh base..."
            git fetch origin main
            git reset --hard origin/main
            python scripts/update.py --refresh
            commit_refresh || { echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Deploy from THIS working tree (the one we just generated and committed),
      # not a fresh checkout that would resolve to the run-trigger SHA and lag a
      # cycle behind. Runs unconditionally so a no-op refresh still redeploys the
      # current docs/ (which already matches origin/main).
      - name: Setup Pages
        if: always()
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v5
